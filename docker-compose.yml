x-service-env: &service-env
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  DYNAMODB_ENDPOINT: http://dynamodb:8000
  TABLE_PREFIX: crb-
  ROOMS_URL: http://rooms:5000
  WEATHER_URL: http://weather:5000
  JWT_SECRET: local-dev-secret-key-at-least-32-bytes

services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports: ["8000:8000"]

  setup-db:
    image: python:3.12-slim
    environment: *service-env
    volumes: ["./scripts:/scripts:ro"]
    command: sh -c "pip install -q boto3 && python /scripts/setup_db.py"
    depends_on: [dynamodb]

  dynamodb-admin:   # web viewer for the local tables
    image: aaronshaf/dynamodb-admin:latest
    environment:
      DYNAMO_ENDPOINT: http://dynamodb:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports: ["8001:8001"]
    depends_on: [dynamodb]

  rooms:
    build: ./services/rooms
    environment: *service-env
    ports: ["5002:5000"]
    depends_on:
      setup-db: { condition: service_completed_successfully }

  weather:
    build: ./services/weather
    environment: *service-env
    ports: ["5003:5000"]
    depends_on: [rooms]

  auth:
    build: ./services/auth
    environment: *service-env
    ports: ["5001:5000"]
    depends_on:
      setup-db: { condition: service_completed_successfully }