name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install flake8
      - run: flake8 .

  unit-tests:
    name: Unit tests (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [auth, rooms, weather, booking]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests with coverage gate (80%)
        working-directory: services/${{ matrix.service }}
        run: pytest -v --cov=. --cov-report=term --cov-fail-under=80

  integration:
    name: Build images + end-to-end tests
    runs-on: ubuntu-24.04
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest requests

      - name: Build and start full stack
        run: docker compose up -d --build

      - name: Wait for gateway
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/bookings/health > /dev/null; then
              echo "Stack is up"; exit 0
            fi
            echo "Waiting... ($i)"; sleep 2
          done
          echo "Stack did not start"; exit 1

      - name: Run end-to-end tests
        run: pytest tests/e2e -v

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down
