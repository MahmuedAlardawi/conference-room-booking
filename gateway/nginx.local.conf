# Local stand-in for the AWS Application Load Balancer: same path-based routing rules.
server {
    listen 80;
    location /api/auth     { proxy_pass http://auth:5000; }
    location /api/rooms    { proxy_pass http://rooms:5000; }
    location /api/weather  { proxy_pass http://weather:5000; }
    location /api/bookings { proxy_pass http://booking:5000; }
    location /             { proxy_pass http://frontend:80; }
}