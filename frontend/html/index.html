<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in – Conference Room Booking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Conference Room Booking</h1></header>
  <main class="narrow">
    <div class="card">
      <h2>Log in</h2>
      <form id="login">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email">
        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password">
        <button type="submit">Log in</button>
      </form>
      <div id="msg" class="msg"></div>
      <p class="muted">No account? <a href="register.html">Create one</a></p>
    </div>
  </main>
  <script src="api.js"></script>
  <script>
    if (Api.token()) window.location.href = "booking.html";
    document.getElementById("login").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const data = await Api.call("POST", "/api/auth/login", {
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        });
        Api.saveSession(data);
        window.location.href = "booking.html";
      } catch (err) {
        showMsg(document.getElementById("msg"), err.message, "error");
      }
    });
  </script>
</body>
</html>
