<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account – Conference Room Booking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Conference Room Booking</h1></header>
  <main class="narrow">
    <div class="card">
      <h2>Create account</h2>
      <form id="register">
        <label for="name">Full name</label>
        <input id="name" required autocomplete="name">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email">
        <label for="password">Password (min 8 characters)</label>
        <input id="password" type="password" minlength="8" required autocomplete="new-password">
        <button type="submit">Create account</button>
      </form>
      <div id="msg" class="msg"></div>
      <p class="muted">Already registered? <a href="index.html">Log in</a></p>
    </div>
  </main>
  <script src="api.js"></script>
  <script>
    document.getElementById("register").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const data = await Api.call("POST", "/api/auth/register", {
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        });
        Api.saveSession(data);
        window.location.href = "booking.html";
      } catch (err) {
        showMsg(document.getElementById("msg"), err.message, "error");
      }
    });
  </script>
</body>
</html>
